name: Deploy to cPanel

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # develop -> "staging" environment, main -> "production" environment
    # (add "Required reviewers" to production so live releases wait for approval)
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Keep staging out of search engines
        if: github.ref_name != 'main'
        run: |
          printf '\n<IfModule mod_headers.c>\n  Header always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> public/.htaccess
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt

      - name: Upload site over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          # Target folder on the server. Set an environment variable SERVER_DIR, e.g.
          #   public_html/staging/   (staging)   or   public_html/app/   (production)
          # when using your main cPanel FTP login. Leave it unset if the FTP account
          # is already limited to the target folder.
          server-dir: ${{ vars.SERVER_DIR || './' }}
