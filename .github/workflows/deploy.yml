name: Deploy to cPanel

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # develop -> "staging" environment (teamsayo.com/staging/)
    # main    -> "production" environment (teamsayo.com/app/ + home page at teamsayo.com)
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Keep staging out of search engines
        if: github.ref_name != 'main'
        run: |
          printf '\n<IfModule mod_headers.c>\n  Header always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> public/.htaccess
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt

      - name: Upload platform over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          # SERVER_DIR environment variable: public_html/staging/ or public_html/app/
          server-dir: ${{ vars.SERVER_DIR || './' }}

      - name: Work out the website root folder
        if: github.ref_name == 'main'
        id: root
        run: |
          d="${{ vars.SERVER_DIR }}"
          root="${d%app/}"
          echo "dir=${root:-./}" >> "$GITHUB_OUTPUT"

      - name: Upload home page (teamsayo.com)
        if: github.ref_name == 'main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ${{ steps.root.outputs.dir }}
          # only manage the home page files; never touch app/, staging/ or anything else
          state-name: .ftp-deploy-site-state.json
