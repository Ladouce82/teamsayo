<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1f3d">
<title>TeamSayo — Prototype v3</title>
<style>
:root{--card:#fff;--navy:#0f1f3d;--navy2:#172a4f;--teal:#0b8f8f;--teal2:#e6f6f6;--ink:#1c2433;--mute:#5d6676;--line:#e4e7ec;--bg:#f6f7fb;--red:#c4231a;--redbg:#fef3f2;--amber:#a3420a;--amberbg:#fffaeb;--green:#067647;--greenbg:#ecfdf3;--blue:#175cd3;--bluebg:#eff8ff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4}
a{color:var(--teal);cursor:pointer;text-decoration:underline;text-decoration-color:transparent}a:hover{text-decoration-color:currentColor}
:focus-visible{outline:3px solid #f5b70a;outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--card);padding:8px;z-index:100}.skip:focus{left:8px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--navy);color:#d5dcea;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:18px;padding:4px 8px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#0fa3a3,#3ccfcf);display:grid;place-items:center;font-size:15px}
.tag{font-size:11px;color:#9fb0cf;padding:0 8px 10px}
.navh{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8d9dbd;margin:14px 8px 6px}
.nav{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#d5dcea;background:none;border:0;font:inherit;text-align:left}
.nav:hover{background:var(--navy2)}.nav.on{background:var(--teal);color:#fff}.nav .ic{width:18px;text-align:center}.nav .cnt{margin-left:auto;background:#f04438;color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;flex:1;min-width:140px}
select,input,textarea{font:inherit;border:1px solid #cfd4dc;border-radius:8px;padding:7px 10px;background:var(--card);color:var(--ink)}
textarea{width:100%;min-height:110px}
.btn{font:inherit;border:1px solid #cfd4dc;background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#9aa3b2}.btn.p{background:var(--teal);border-color:var(--teal);color:#fff}.btn.d{color:var(--red)}
.btn.s{padding:4px 9px;font-size:12.5px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{position:relative;font-size:18px;background:none;border:1px solid transparent;border-radius:8px;padding:4px 8px;cursor:pointer}
.iconbtn .badge{position:absolute;top:-4px;right:-4px;background:#f04438;color:#fff;border-radius:99px;font-size:10.5px;padding:0 5px}
.banner{font-size:12.5px;padding:6px 24px;border-bottom:1px solid #fde7b0;background:var(--amberbg);color:var(--amber)}
.banner.ro{background:#fef3f2;color:var(--red);border-color:#fecdca}
.wrap{padding:22px 24px 60px;max-width:1320px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
#menuBtn{display:none}
@media(max-width:1000px){#menuBtn{display:inline-block}.side{display:none}.side.open{display:block}.g4,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{position:static;height:auto}.kan{grid-template-columns:1fr 1fr!important}}
@media(max-width:560px){.g4,.g3{grid-template-columns:1fr}.kan{grid-template-columns:1fr!important}.wrap{padding:14px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 10px;font-size:14.5px}
.kpi .v{font-size:26px;font-weight:700}.kpi .l{color:var(--mute);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;background:#fafbfc}
.flash,tr.flash td{animation:fl 2.4s ease}@keyframes fl{0%,40%{background:var(--card)3b0}100%{background:transparent}}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:#f2f4f7;color:#344054}
.pill.red{background:var(--redbg);color:var(--red)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.green{background:var(--greenbg);color:var(--green)}.pill.blue{background:var(--bluebg);color:var(--blue)}.pill.teal{background:var(--teal2);color:#0b6b6b}.pill.navy{background:var(--navy);color:#fff}
.org{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;font-size:13px}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bar{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px}.bar.over>i{background:var(--red)}
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#eef1f6;border-radius:12px;padding:10px;min-height:200px}
.col h4{margin:2px 4px 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.it{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.it:hover{border-color:var(--teal)}.it .t{font-weight:600;margin-bottom:6px}.it .m{font-size:12px;color:var(--mute)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ph{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph .im{height:120px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,#dff5f5,#e7ecfb);background-size:cover;background-position:center}
.ph .c{padding:10px;font-size:12.5px}
.modalbg{position:fixed;inset:0;background:rgba(15,31,61,.45);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
.modal{background:var(--card);border-radius:14px;width:min(680px,100%);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin:0 0 14px;font-size:17px}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,100%);background:var(--card);box-shadow:-10px 0 40px rgba(0,0,0,.2);z-index:40;display:none;flex-direction:column}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.drawer .bd{overflow:auto;padding:12px 16px;flex:1}
.ncard{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}.ncard.unread{border-left:4px solid var(--teal)}
.teams{background:#f5f5fb;border:1px solid #dcdcf2;border-radius:8px;padding:8px;margin-top:8px;font-size:12.5px}.teams b{color:#4b53bc}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:4px}.fld input,.fld select,.fld textarea{width:100%}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:4px}
.msg{padding:10px 12px;border-radius:12px;max-width:82%;line-height:1.45}
.msg.u{align-self:flex-end;background:var(--navy);color:#fff}.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.cite{font-size:11px;vertical-align:super;background:var(--teal2);color:#0b6b6b;border-radius:4px;padding:0 4px;margin-left:2px;cursor:pointer;border:0}
.report{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 34px;line-height:1.6}
.report h2{margin-top:0}.report h4{margin:18px 0 6px}
.chain{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.chain .n{flex:1;min-width:100px;background:var(--teal2);border-radius:10px;padding:10px;text-align:center}.chain .n b{display:block;font-size:22px}.chain .a{align-self:center;color:var(--mute)}
.feed div{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.muted{color:var(--mute)}.small{font-size:12.5px}
.plan{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--card)}.plan.cur{border:2px solid var(--teal)}.plan .pr{font-size:24px;font-weight:700;margin:6px 0}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{width:42px;height:24px;border-radius:99px;background:#b9c0cc;position:relative;cursor:pointer;border:0;flex:none}.sw.on{background:var(--teal)}
.sw::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--card);top:2px;left:2px;transition:.15s}.sw.on::after{left:20px}
.empty{padding:26px;text-align:center;color:var(--mute)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:inline-grid;place-items:center;font-weight:600;font-size:12.5px;flex:none}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:70;max-width:420px}
.overlay{position:fixed;inset:0;background:linear-gradient(135deg,#0f1f3d,#12395a);z-index:80;display:none;overflow:auto;padding:5vh 16px}
.lbox{background:var(--card);border-radius:16px;max-width:860px;margin:0 auto;padding:28px}
.acc{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card);font:inherit;text-align:left;width:100%}
.acc:hover{border-color:var(--teal)}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps i{flex:1;height:4px;border-radius:9px;background:#e4e7ec}.steps i.on{background:var(--teal)}
.gate{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.status{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--greenbg);color:var(--green)}.status.off{background:var(--amberbg);color:var(--amber)}
.wm{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#98a2b3;z-index:3;pointer-events:none}
code{background:#f2f4f7;padding:1px 5px;border-radius:4px;font-size:12px}
pre{background:#0f1f3d;color:#d5f5f5;padding:12px;border-radius:8px;overflow:auto;font-size:12px}
@media print{.side,.top,.banner,.noprint,.wm{display:none!important}.app{display:block}.report{border:none}}

[data-theme=dark]{--card:#121c30;--bg:#0b1220;--ink:#e6e9ef;--mute:#9aa5b8;--line:#25324a;--navy:#070d1a;--navy2:#16223a;--teal:#22a6a6;--teal2:#123536;--redbg:#3a1416;--amberbg:#3a2a0e;--greenbg:#0f2e1f;--bluebg:#0f2140;--red:#ff8a80;--amber:#f7b955;--green:#5fd39a;--blue:#8db7ff}
[data-theme=dark] select,[data-theme=dark] input,[data-theme=dark] textarea,[data-theme=dark] .btn{color:var(--ink);border-color:#33415c}
[data-theme=dark] .pill{background:#1e2a42;color:#d0d6e2}[data-theme=dark] th{background:#162238}[data-theme=dark] .col{background:#0f182a}[data-theme=dark] code{background:#1e2a42;color:#d0d6e2}[data-theme=dark] .banner{border-color:#4a3a14}
[data-theme=navy]{--teal:#1d4ed8;--teal2:#e0e9ff;--navy:#0b1b3a}[data-theme=indigo]{--teal:#4f46e5;--teal2:#e8e7ff;--navy:#1e1b4b}[data-theme=purple]{--teal:#7c3aed;--teal2:#f1e9ff;--navy:#2e1065}
[data-theme=burgundy]{--teal:#9f1239;--teal2:#ffe4ea;--navy:#3b0a1a}[data-theme=green]{--teal:#15803d;--teal2:#e3f6e9;--navy:#052e16}[data-theme=orange]{--teal:#c2410c;--teal2:#ffeadd;--navy:#431407}
[data-theme=multi]{--teal:#db2777;--teal2:#fde7f3;--navy:#1e3a8a;--navy2:#24479f}
[data-theme=multi] .kpi:nth-child(4n+1) .v{color:#2563eb}[data-theme=multi] .kpi:nth-child(4n+2) .v{color:#db2777}[data-theme=multi] .kpi:nth-child(4n+3) .v{color:#16a34a}[data-theme=multi] .kpi:nth-child(4n) .v{color:#ea580c}
details summary{cursor:pointer}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <nav class="side" id="sideNav" aria-label="Main navigation">
    <div class="brand"><div class="logo" aria-hidden="true">✓</div>TeamSayo</div>
    <div class="tag">From decision to done.</div>
    <div id="nav"></div>
  </nav>
  <div class="main">
    <div id="banners"></div>
    <header class="top">
      <button class="btn" id="menuBtn" aria-label="Menu" aria-controls="sideNav" onclick="document.querySelector('.side').classList.toggle('open')">☰</button>
      <h1 id="title">Dashboard</h1>
      <span id="sync" class="status" role="status"></span>
      <label class="small muted" for="orgSel" style="position:absolute;left:-999px">Company</label>
      <select id="orgSel" onchange="setOrg(this.value)" aria-label="Switch company"></select>
      <select id="langSel" onchange="setLang(this.value)" aria-label="Language"><option value="en">EN</option><option value="de">DE</option></select>
      <button class="btn" id="copilotBtn" onclick="go('copilot')">✦ Copilot</button>
      <button class="iconbtn" onclick="openNotifs()" aria-label="Notifications">🔔<span class="badge" id="nbadge"></span></button>
      <button class="iconbtn" onclick="userMenu()" aria-label="Account menu"><span class="avatar" id="meAv">?</span></button>
    </header>
    <main class="wrap" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Notifications"></div>
<div class="modalbg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="wm" id="wm"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importBackup(this)">

<script type="application/json" id="ts-seed">{"version":0,"data":null}</script>
<script>
"use strict";
let PRISTINE = document.documentElement.cloneNode(true);
const KEY = 'teamsayo_prototype_v3';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const iso = d => d.toISOString().slice(0, 10);
const TODAY = iso(new Date());
const dOff = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const tsOff = (days, h) => { const d = new Date(); d.setDate(d.getDate() + days); if (h != null) d.setHours(h, 0, 0, 0); return d.toISOString(); };
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const fmt = s => { if (!s) return ''; const d = new Date(String(s).length === 10 ? s + 'T00:00:00' : s); return d.toLocaleDateString(S?.settings?.lang === 'de' ? 'de-DE' : 'en-GB', {day:'numeric', month:'short', year:'numeric'}); };
const fmtT = s => new Date(s).toLocaleString(S?.settings?.lang === 'de' ? 'de-DE' : 'en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const eur = n => '€' + Math.round(n).toLocaleString('en-GB');
const SENSITIVE = ['attendance', 'capacity', 'leave'];
const isSens = k => SENSITIVE.includes(k) || !!(S && S.recordTypes.find(x => x.key === k)?.sensitive);
const PRICES = {Starter:0, Team:6, Business:10, Enterprise:20};

let S = null;
let UI = {view:'dashboard', hubType:'attendance', highlight:null, chat:[], report:null, sources:[], personId:null, setTab:'general', reviewId:null};
let SNAPSHOT_RO = false;

/* ================= i18n ================= */
const DE = {'Dashboard':'Übersicht','Team Hub':'Team-Hub','People & portfolios':'Personen & Portfolios','Meetings & decisions':'Meetings & Entscheidungen','Accountability':'Verantwortlichkeiten','Goals & OKRs':'Ziele & OKRs','Check-ins & recognition':'Check-ins & Anerkennung','Reviews & 360°':'Beurteilungen & 360°','Approvals':'Freigaben','Reports':'Berichte','Copilot':'Copilot','Impact & pilot':'Wirkung & Pilot','Settings':'Einstellungen','My data & privacy':'Meine Daten & Datenschutz','Operator console':'Betreiberkonsole','Workspace':'Arbeitsbereich','Execution':'Umsetzung','People':'Mitarbeitende','Intelligence':'Analyse','Admin':'Verwaltung','All companies (group view)':'Alle Unternehmen (Gruppenansicht)','Synced':'Synchronisiert','Offline':'Offline','Open actions':'Offene Aufgaben','Overdue':'Überfällig','Average goal progress':'Ø Zielfortschritt','Certifications expiring ≤ 60 days':'Zertifikate laufen ≤ 60 Tage ab','Due next':'Als Nächstes fällig','Team capacity this week':'Teamauslastung diese Woche','Recent decisions':'Letzte Entscheidungen','Achievements & activity':'Erfolge & Aktivität','Post an update':'Update posten','Save':'Speichern','Cancel':'Abbrechen','Sign out':'Abmelden','Notifications':'Benachrichtigungen','Accountability tracker':'Verantwortlichkeiten','Achievement portfolio':'Erfolgsportfolio','Execution chain — from strategy to evidence':'Umsetzungskette — von der Strategie zum Nachweis'};
const t = s => (S?.settings?.lang === 'de' && DE[s]) || s;

/* ================= Demo data ================= */
const F = (k,label,type,opts) => ({k,label,type,opts});
const CORE_TYPES = () => [
  {key:'attendance', name:'Attendance', icon:'🗓', fields:[F('person','Person','person'),F('date','Date','date'),F('status','Status','select',['Present','Remote','Leave','Absent']),F('note','Note','text')]},
  {key:'capacity', name:'Capacity', icon:'⏱', fields:[F('person','Person','person'),F('week','Week starting','date'),F('available','Available hours','number'),F('allocated','Allocated hours','number')]},
  {key:'leave', name:'Leave', icon:'🏖', fields:[F('person','Person','person'),F('kind','Type','select',['Annual leave','Sick leave','Parental leave','Training','Other']),F('from','From','date'),F('to','To','date'),F('days','Working days','number')]},
  {key:'mentorship', name:'Mentorship', icon:'🤝', fields:[F('mentor','Mentor','person'),F('mentee','Mentee','person'),F('goal','Goal','text'),F('sessions','Sessions held','number'),F('status','Status','select',['Active','Completed','Paused'])]},
  {key:'certifications', name:'Certifications', icon:'🎓', fields:[F('person','Person','person'),F('name','Certificate','text'),F('issuer','Issuer','text'),F('issued','Issued','date'),F('expires','Expires','date'),F('evidence','Evidence link','text')]},
  {key:'speaking', name:'Public speaking', icon:'🎤', fields:[F('person','Speaker','person'),F('event','Event','text'),F('topic','Topic','text'),F('date','Date','date'),F('audience','Audience size','number'),F('link','Link','text')]},
  {key:'jobs', name:'Jobs', icon:'💼', fields:[F('title','Job','text'),F('client','Client','text'),F('owner','Owner','person'),F('status','Status','select',['Briefed','In progress','In review','Delivered']),F('due','Due','date')]},
  {key:'projects', name:'Projects', icon:'📁', fields:[F('name','Project','text'),F('lead','Lead','person'),F('milestone','Next milestone','text'),F('status','Status','select',['On track','At risk','Blocked','Complete']),F('progress','Progress %','number')]},
  {key:'photos', name:'Photos', icon:'📷', fields:[F('title','Title','text'),F('caption','Caption','text'),F('date','Date','date'),F('image','Image','image')]}];
const PACKS = {
  'Creative & digital studio': {desc:'Jobs, capacity, portfolio media, talks — the pilot set', types:[]},
  'NGO & development': {desc:'Field visits, people reached, grant deliverables, safeguarding training, donor reports', types:[
    {key:'field_visits', name:'Field visits', icon:'🚙', fields:[F('person','Staff','person'),F('site','Site / community','text'),F('date','Date','date'),F('purpose','Purpose','text'),F('findings','Findings','textarea')]},
    {key:'reach', name:'People reached', icon:'👪', fields:[F('programme','Programme','text'),F('indicator','Indicator','text'),F('date','Period end','date'),F('target','Target','number'),F('actual','Actual','number')]},
    {key:'grants', name:'Grant deliverables', icon:'📑', fields:[F('donor','Donor','text'),F('deliverable','Deliverable','text'),F('owner','Owner','person'),F('due','Due','date'),F('status','Status','select',['Not started','In progress','Submitted','Accepted'])]},
    {key:'safeguarding', name:'Safeguarding training', icon:'🛡', fields:[F('person','Person','person'),F('course','Course','text'),F('completed','Completed','date'),F('expires','Expires','date')]}]},

/* ================= Persistence & boot ================= */
const COLL = {orgs:'id', people:'id', users:'id', recordTypes:'key', records:'id', meetings:'id', actions:'id', goals:'id', kudos:'id', checkins:'id', reviews:'id', feedback:'id', feedbackRequests:'id', rules:'id'};
function mergeData(base, inc){
  const out = JSON.parse(JSON.stringify(base));
  for (const [c,k] of Object.entries(COLL)){ const map = new Map((out[c]||[]).map(x => [x[k], x])); (inc[c]||[]).forEach(x => map.set(x[k], x)); out[c] = [...map.values()]; }
  out.integrations = Object.assign({}, out.integrations, inc.integrations);
  out.audit = (out.audit||[]).concat([{id:uid(), ts:new Date().toISOString(), user:'system', action:'Merged data from file', detail:''}]);
  return out;
}
function save(){
  if (SNAPSHOT_RO) return;
  if (!navigator.onLine){ S._queue = (S._queue||0) + 1; }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { toast('Browser storage is full — download a backup'); }
  renderSync();
}
function ensureShape(){
  const d = makeDemo();
  ['users','reviews','feedback','feedbackRequests','audit','notifs','rules','invoices','support'].forEach(k => { if (!S[k]) S[k] = d[k]; });
  if (!S.nkeys) S.nkeys = {}; if (!S.stats) S.stats = {reports:0, ai:0, updates:0};
  S.settings = Object.assign(baseSettings(), S.settings||{});
  if (!S.currentOrg) S.currentOrg = 'all';
}
async function boot(){
  let seed = null, stored = null;
  try { seed = JSON.parse(document.getElementById('ts-seed').textContent); } catch(e) {}
  try { stored = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  if (seed && seed.enc){ const data = await unlockScreen(seed); finishBoot({version:seed.version, data, ro:seed.ro}, stored); }
  else finishBoot(seed && seed.data ? seed : {version:0, data:makeDemo()}, stored);
}
function finishBoot(seed, stored){
  if (seed.ro || seed.data?.readOnly){ SNAPSHOT_RO = true; S = seed.data; ensureShape(); S.session = 'viewer'; S.users.push({id:'viewer', name:'Snapshot viewer', title:'Read-only', role:'viewer', org:null}); render(); return; }
  if (!stored){ S = seed.data; S._v = seed.version; }
  else if ((seed.version||0) > (stored._v||0)){ S = mergeData(stored, seed.data); S._v = seed.version; setTimeout(() => toast('Entries from this file were merged into this browser'), 300); }
  else S = stored;
  ensureShape(); save();
  if (!me()) showLogin(); else render();
}

  <div class="fld"><label>Evidence</label><input id="qu_e" value="${esc(ev || best.evidence)}"></div><div class="fld"><label>Note</label><input id="qu_n" value="${esc(txt)}"></div>`, () => {

function ruleExtract(m){
  const props = [];

    const line = l.replace(/^[A-Z][\w .'-]{1,30}:\s+(?=(decision|action|we decided|agreed|.*\bwill\b))/i, '');
    if (/^(decision|agreed|we decided)\s*:?/i.test(line)) props.push({kind:'Decision', text:line.replace(/^(decision|agreed|we decided)\s*:?\s*/i, '')});

async function aiEvidence(rid){
  const r = S.reviews.find(x => x.id === rid); const p = r.person;

function scheduleReport(){ openModal('Schedule this report', `<div class="fld"><label>Frequency</label><select><option>Monthly, first working day</option><option>Weekly, Monday 08:00</option><option>Quarterly</option></select></div><div class="fld"><label>Send to</label><input value="leadership@yourgroup.com"></div><label class="chk"><input type="checkbox" checked> Require approval before sending</label>`, () => { log('Scheduled report'); save(); toast('Report scheduled — a draft will be waiting for approval each month'); }); }
async function genReport(){
  const type = $('#r_type')?.value || 'Monthly management report', per = +($('#r_per')?.value || 30), from = dOff(-per);
  const src = []; const cite = (label, view, id, extra) => { src.push({label, view, id, extra}); return `<button class="cite" aria-label="Source ${src.length}: ${esc(label)}" onclick="goSource(${src.length-1})">${src.length}</button>`; };
  const acts = S.actions.filter(inOrg); const done = acts.filter(a => a.status === 'done' && (a.completedAt||a.due) >= from); const over = acts.filter(isOverdue);
  const onTime = done.filter(a => (a.completedAt||a.due) <= a.due).length;
  const recs = S.records.filter(canSeeRecord); const talks = recs.filter(r => r.type === 'speaking' && r.fields.date >= from);
  const certs = recs.filter(r => r.type === 'certifications' && r.approval !== 'Pending'); const exp = certs.filter(r => r.fields.expires && daysBetween(TODAY, r.fields.expires) <= 60);
  const projects = recs.filter(r => r.type === 'projects'); const risk = projects.filter(r => ['At risk','Blocked'].includes(r.fields.status));

  const nDec = ms.reduce((s,m) => s+m.decisions.length, 0);

  let h = `<div class="report"><div class="row noprint" style="margin-bottom:10px"><span class="pill amber" id="rStat">Draft — awaiting approval</span><span class="sp"></span>${can('approve')?`<button class="btn" onclick="approveReport(this)">✓ Approve</button>`:''}<button class="btn" onclick="window.print()">⬇ PDF</button><button class="btn" onclick="exportReportDoc()">⬇ Word</button></div>
  <h2>${esc(type)}</h2><div class="muted">${esc(curOrgName())} · ${fmt(from)} – ${fmt(TODAY)} · prepared for ${audience}</div>

  <h4>Progress against goals</h4>${goals.map(g => `<p>• <b>${esc(g.title)}</b>: ${Math.round(g.krs.reduce((s,k)=>s+k.p,0)/g.krs.length)}% average across ${g.krs.length} key results${cite(g.title,'goals',g.id)}.</p>`).join('') || '<p class="muted">No goals in scope.</p>'}
  <h4>Delivery</h4>${projects.map(r => `<p>• ${esc(r.fields.name)} is ${esc(String(r.fields.status).toLowerCase())} at ${r.fields.progress}%; next milestone: ${esc(r.fields.milestone)}${cite(r.fields.name,'hub',r.id,'projects')}.</p>`).join('') || '<p class="muted">No projects in scope.</p>'}
  ${risk.length ? `<p><b>Attention:</b> ${risk.length} project${risk.length>1?'s are':' is'} at risk or blocked and need${risk.length>1?'':'s'} a decision.</p>` : ''}
  <h4>People and capability</h4><p>${talks.length} public talk${talks.length===1?'':'s'} given or scheduled${talks.map(r => cite(r.fields.event,'hub',r.id,'speaking')).join('')}. ${certs.length} verified certification${certs.length===1?'':'s'} on record, ${exp.length} expiring within 60 days${exp.map(r => cite(r.fields.name,'hub',r.id,'certifications')).join('')}. ${overCap.length ? `${overCap.length} team member${overCap.length>1?'s are':' is'} allocated above capacity this week${overCap.map(r => cite(pname(r.fields.person)+' capacity','hub',r.id,'capacity')).join('')}.` : 'No one is allocated above capacity this week.'}</p>
  <h4>Recommended decisions</h4><p>• Resolve the ${over.length} overdue item${over.length===1?'':'s'} or re-plan them at the next leadership meeting.<br>• ${risk.length ? 'Unblock '+esc(risk[0].fields.name)+' with an owner decision this week.' : 'Keep the current delivery plan.'}<br>• ${exp.length ? 'Approve renewal of expiring certifications.' : 'No certification renewals needed.'}</p>
  <h4>Sources</h4><ol class="small">${src.map((s,i) => `<li><a onclick="goSource(${i})">${esc(s.label)}</a> <span class="muted">(${s.view==='hub'?s.extra:s.view})</span></li>`).join('')}</ol>
  <p class="small muted">Drafted by TeamSayo from ${src.length} source records. Review before sharing.</p></div>`;
  UI.report = h; UI.sources = src; S.stats.reports++; log('Drafted report', type); save(); render();
}

/* ================= Copilot & AI ================= */
async function llm(system, user){
  const k = S.settings.ai.key; if (!k) return null;
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}, body:JSON.stringify({model:S.settings.ai.model || 'claude-sonnet-5-5', max_tokens:1200, system, messages:[{role:'user', content:user}]})});
    if (!r.ok) throw new Error('HTTP ' + r.status); const j = await r.json(); return (j.content||[]).map(c => c.text||'').join('');
  } catch(e) { toast('AI model unavailable (' + e.message + ') — used built-in rules'); return null; }
}
function vCopilot(){
  if (!UI.chat.length) UI.chat.push({r:'a', t:`Hi ${esc(me().name.split(' ')[0])} — I answer from TeamSayo records you are allowed to see (${esc(curOrgName())}) and cite every source. ${S.settings.ai.key ? 'Connected to your AI model.' : 'Running on built-in rules; connect an AI model in Settings for open questions.'}`});
  const sugg = ['What is overdue?','Which certifications expire soon?','Who is over capacity?','What did we decide recently?','Summarise achievements this month','How are our goals tracking?','What is waiting for approval?'];
  return `<div class="card"><div class="chat" id="chat" aria-live="polite">${UI.chat.map(m => `<div class="msg ${m.r}">${m.t}</div>`).join('')}</div>
  <div class="row" style="margin-top:12px">${sugg.map(s => `<button class="btn s" onclick="ask('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('')}</div>
  <div class="row" style="margin-top:10px"><input id="q" class="sp" aria-label="Ask Copilot" placeholder="Ask about decisions, actions, people, records…" onkeydown="if(event.key==='Enter')ask(this.value)"><button class="btn p" onclick="ask($('#q').value)">Ask</button></div>
  <div class="small muted" style="margin-top:8px">Copilot only reads data you are allowed to see. It summarises and finds; it never rates or ranks people.</div></div>`;
}
async function ask(q){
  q = (q||'').trim(); if (!q) return; UI.chat.push({r:'u', t:esc(q)}); const l = q.toLowerCase();
  const link = (label, view, id, extra) => `<a onclick="go('${view}',{hubType:'${extra||''}',highlight:'${id}'})">${esc(label)}</a>`;
  const acts = S.actions.filter(inOrg), recs = S.records.filter(canSeeRecord); let a;
  if (/overdue|late|behind|überfällig/.test(l)){ const o = acts.filter(isOverdue); a = o.length ? `${o.length} action(s) are overdue:<br>` + o.map(x => `• ${link(x.title,'actions',x.id)} — ${esc(pname(x.owner))}, ${daysBetween(x.due,TODAY)} days late`).join('<br>') : 'Nothing is overdue. 🎉'; }
  else if (/cert|expir|licen/.test(l)){ const e = recs.filter(r => r.type==='certifications' && r.fields.expires && daysBetween(TODAY, r.fields.expires) <= 90); a = e.length ? 'Expiring within 90 days:<br>' + e.map(r => `• ${link(r.fields.name,'hub',r.id,'certifications')} — ${esc(pname(r.fields.person))}, ${fmt(r.fields.expires)}`).join('<br>') : 'No certifications you can see expire in the next 90 days.'; }
  else if (/capacity|overload|workload|busy|auslastung/.test(l)){ const o = recs.filter(r => r.type==='capacity' && +r.fields.allocated > +r.fields.available); a = o.length ? 'Allocated above capacity this week:<br>' + o.map(r => `• ${link(pname(r.fields.person),'hub',r.id,'capacity')} — ${r.fields.allocated} h of ${r.fields.available} h`).join('<br>') : 'No one you can see is over capacity this week.'; }
  else if (/decid|decision|entscheid/.test(l)){ const d = S.meetings.filter(inOrg).sort((x,y) => y.date.localeCompare(x.date)).flatMap(m => m.decisions.map(t0 => `• ${esc(t0)} — ${link(m.title,'meetings',m.id)}, ${fmt(m.date)}`)); a = d.length ? 'Recent decisions:<br>' + d.slice(0,6).join('<br>') : 'No decisions recorded yet.'; }
  else if (/goal|okr|objective|ziel/.test(l)){ a = S.goals.filter(inOrg).map(g => `• ${link(g.title,'goals',g.id)} — ${Math.round(g.krs.reduce((s,k)=>s+k.p,0)/g.krs.length)}%`).join('<br>') || 'No goals yet.'; }
  else if (/approv|freigabe|waiting/.test(l)){ const p = S.records.filter(r => r.approval==='Pending' && inOrg(r)); a = p.length ? `${p.length} request(s) waiting:<br>` + p.map(r => `• ${esc(S.recordTypes.find(x=>x.key===r.type).name)} — ${esc(pname(r.fields.person||r.fields.owner))}`).join('<br>') + (can('approve') ? `<br><a onclick="go('approvals')">Open approvals →</a>` : '') : 'Nothing is waiting for approval.'; }
  else if (/achiev|accomplish|deliver|done|erfolg/.test(l)){ const d = acts.filter(x => x.status==='done'); const tk = recs.filter(r => r.type==='speaking'); const k = S.kudos.filter(inOrg);
    a = `Highlights:<br>${d.map(x => `• Delivered ${link(x.title,'actions',x.id)} (${esc(pname(x.owner))})`).join('<br>')}<br>${tk.map(r => `• ${esc(pname(r.fields.person))} spoke at ${link(r.fields.event,'hub',r.id,'speaking')}`).join('<br>')}<br>• ${k.length} recognition post(s) on the wall`; }
  else if (S.settings.ai.key){
    UI.chat.push({r:'a', t:'<span class="muted">Thinking…</span>'}); render();
    const ctx = JSON.stringify({actions:acts.map(x => ({id:x.id, title:x.title, owner:pname(x.owner), due:x.due, status:actStatus(x)})), decisions:S.meetings.filter(inOrg).map(m => ({id:m.id, meeting:m.title, date:m.date, decisions:m.decisions})), goals:S.goals.filter(inOrg).map(g => ({id:g.id, title:g.title, krs:g.krs})), records:recs.slice(0,120).map(r => ({id:r.id, type:r.type, fields:Object.fromEntries(Object.entries(r.fields).filter(([k]) => k!=='image').map(([k,v]) => [k, person(v) ? pname(v) : v]))}))});
    const out = await llm('You are TeamSayo Copilot. Answer only from the JSON data provided. Cite record ids in square brackets like [a3]. Never rate, score or rank individual people. Be brief.', `Data: ${ctx}\n\nQuestion: ${q}`);
    UI.chat.pop(); if (out){ S.stats.ai++; a = esc(out).replace(/\n/g,'<br>').replace(/\[([\w]+)\]/g, (m0, id) => { const x = S.actions.find(z => z.id===id) || S.records.find(z => z.id===id) || S.goals.find(z => z.id===id) || S.meetings.find(z => z.id===id); if (!x) return m0; const view = S.actions.includes(x)?'actions':S.goals.includes(x)?'goals':S.meetings.includes(x)?'meetings':'hub'; return `<button class="cite" onclick="go('${view}',{hubType:'${x.type||''}',highlight:'${id}'})">${id}</button>`; }); }
  }
  if (!a){ const hit = S.people.find(p => l.includes(p.name.split(' ')[0].toLowerCase()));
    a = hit ? `${esc(hit.name)} (${esc(hit.title)}, ${esc(org(hit.org)?.name)}): ${S.actions.filter(x => x.owner===hit.id && x.status!=='done').length} open action(s), ${S.actions.filter(x => x.owner===hit.id && x.status==='done').length} delivered. <a onclick="go('person',{personId:'${hit.id}'})">Open portfolio →</a>`
      : 'With built-in rules I can answer about overdue actions, certifications, capacity, decisions, goals, approvals, achievements, or a named person. Connect an AI model in Settings → General for any question.'; }
  UI.chat.push({r:'a', t:a}); log('Asked Copilot', q.slice(0,60)); save(); render();
}

function vImpact(){

  const since = Date.now() - 7*864e5; const active = new Set(S.audit.filter(e => Date.parse(e.ts) >= since && ppl.some(p => p.id === e.user)).map(e => e.user));
  const wau = ppl.length ? Math.round(active.size / ppl.length * 100) : 0;
  const done = S.actions.filter(inOrg).filter(a => a.status === 'done'); const onTime = done.length ? Math.round(done.filter(a => (a.completedAt||a.due) <= a.due).length / done.length * 100) : 0;
  const ms = S.meetings.filter(inOrg); const dec = ms.reduce((s,m) => s + m.decisions.length, 0); const tracked = S.actions.filter(a => inOrg(a) && a.source).length;
  const saved = Math.max(0, imp.before - imp.after); const savedPct = imp.before ? Math.round(saved / imp.before * 100) : 0;
  const yearly = saved * imp.rate * 12; const cost = (PRICES[S.plan]||0) * ppl.length * 12 * (S.nonprofit ? .75 : 1); const roi = cost ? (yearly / cost).toFixed(1) : '—';

  <div class="card kpi"><div class="l">Reporting hours saved / month</div><div class="v">${saved} h</div><div class="small muted">${savedPct}% less than before</div></div>
  <div class="card kpi"><div class="l">Annual value vs subscription</div><div class="v">${roi}×</div><div class="small muted">${eur(yearly)} saved vs ${eur(cost)} cost</div></div></div>
  <div class="grid g2" style="margin-top:16px"><div class="card"><h3>Pilot scorecard — validation gates</h3>${gates.map(g => `<div class="gate"><span>${g[2]?'✅':'⬜'}</span><span class="sp"><b>${g[0]}</b><div class="small muted">Target: ${g[3]}</div></span><span class="pill ${g[2]?'green':'amber'}">${esc(g[1])}</span></div>`).join('')}
  <p class="small muted">${gates.filter(g => g[2]).length} of ${gates.length} gates passed.</p></div>

function importCSV(inp){
  const f = inp.files[0]; if (!f) return; const key = $('#csv_t').value; const t0 = S.recordTypes.find(x => x.key === key); const rd = new FileReader();
  rd.onload = () => { const rows = String(rd.result).split(/\r?\n/).filter(Boolean).map(l => (l.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[]).map(c => c.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"')).slice(0,-1));
    const head = rows.shift().map(h => h.trim().toLowerCase()); let n = 0;
    rows.forEach(r => { const rec = {id:uid(), type:key, org:scopeOrg()==='all'?S.orgs[0].id:scopeOrg(), fields:{}, created:TODAY, by:S.session};
      t0.fields.forEach(fd => { const i = head.indexOf(fd.label.toLowerCase()); if (i < 0) return; let v = r[i]; if (fd.type === 'person'){ const p = S.people.find(x => x.name.toLowerCase() === String(v).toLowerCase()); v = p ? p.id : ''; } if (fd.type === 'number') v = +v; rec.fields[fd.k] = v; });
      const ci = head.indexOf('company'); if (ci >= 0){ const o = S.orgs.find(x => x.name.toLowerCase() === String(r[ci]).toLowerCase()); if (o) rec.org = o.id; }
      S.records.push(rec); n++; });
    log('Imported CSV', `${n} ${t0.name}`); save(); go('hub', {hubType:key}); toast(`${n} row(s) imported into ${t0.name}`); inp.value = ''; };
  rd.readAsText(f);
}

function installPack(k){ PACKS[k].types.forEach(x => { if (!S.recordTypes.some(y => y.key === x.key)) S.recordTypes.push(JSON.parse(JSON.stringify(x))); }); log('Installed template pack', k); save(); render(); toast(`${k} pack installed — see Team Hub`); }
function addType(){
  const name = $('#rt_n').value.trim(); const lines = $('#rt_f').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!name || !lines.length){ toast('Add a name and at least one field'); return; }
  const fields = lines.map(l => { const i = l.indexOf(':'); const label = (i < 0 ? l : l.slice(0, i)).trim(); const typ = (i < 0 ? 'text' : l.slice(i+1)).trim(); const k = label.toLowerCase().replace(/[^a-z0-9]+/g,'_') || uid();
    if (typ.startsWith('select=')) return {k, label, type:'select', opts:typ.slice(7).split('|').map(s => s.trim())};
    return {k, label, type:['text','number','date','person','textarea','image'].includes(typ) ? typ : 'text'}; });
  const key = name.toLowerCase().replace(/[^a-z0-9]+/g,'_') + '_' + Date.now().toString(36);
  S.recordTypes.push({key, name, icon:'🧩', fields});
  if ($('#rt_a').checked) S.rules.push({id:uid(), name:`${name} needs manager approval`, trigger:'approval', type:key, action:'require_approval', on:true});
  if ($('#rt_s').checked) S.recordTypes[S.recordTypes.length-1].sensitive = true;
  log('Created record type', name); save(); go('hub', {hubType:key}); toast(`“${name}” created — it works like any built-in type`);
}

function checkout(plan){

  window._calc = calc;
  openModal(`Upgrade to ${plan}`, `<div class="grid g2"><div class="fld"><label for="co_s">Seats</label><input id="co_s" type="number" min="1" value="${seats}" oninput="_calc()"></div><div class="fld"><label for="co_c">Billing</label><select id="co_c" onchange="_calc()"><option value="annual">Annual (save ~17%)</option><option value="monthly">Monthly</option></select></div></div>

  <div class="fld"><label>Payment method</label><select><option>Card •••• 4242 (demo)</option><option>SEPA Direct Debit (demo)</option><option>Invoice / bank transfer</option></select></div>
  <div class="fld"><label>VAT ID (optional, EU reverse charge)</label><input placeholder="DE123456789"></div><div class="card" id="co_t" style="background:#f6f7fb"></div>`, () => {
    const c = calc(); const inv = {id:uid(), no:'TS-' + new Date().getFullYear() + '-' + String(S.invoices.length + 1).padStart(4,'0'), date:TODAY, plan, seats:c.n, cycle:c.cyc, net:c.net, vat:c.vat, total:c.net + c.vat};
    S.invoices.unshift(inv); S.plan = plan; S.trialEnds = ''; S.nonprofit = c.np; log('Subscribed', `${plan} · ${c.n} seats · ${c.cyc}`); save(); render(); toast(`Payment successful (demo) — welcome to ${plan}`);

}

  <div class="card"><h3>Overall KPI score by sprint</h3>${svgBars(trend.map(x => ({l:x.l, v:x.v == null ? 0 : x.v})), 10, '/10')}</div></div>`;

/* ---------- small SVG charts ---------- */
function svgBars(data, max, unit){
  if (!data.length) return '<div class="empty">No data yet</div>';
  const W = 520, H = 180, bw = Math.min(48, (W - 40) / data.length - 8), mx = max || Math.max(1, ...data.map(d => d.v));
  return `<svg viewBox="0 0 ${W} ${H+28}" role="img" aria-label="Bar chart" style="width:100%;height:auto">${data.map((d,i) => { const h = Math.round((d.v / mx) * H), x = 30 + i * ((W - 40) / data.length); return `<rect x="${x}" y="${H - h + 4}" width="${bw}" height="${h}" rx="4" fill="var(--teal)" opacity="${d.v ? 1 : .25}"><title>${esc(d.l)}: ${d.v}${unit||''}</title></rect><text x="${x + bw/2}" y="${H + 20}" font-size="11" text-anchor="middle" fill="var(--mute)">${esc(String(d.l).slice(0,10))}</text><text x="${x + bw/2}" y="${H - h}" font-size="11" text-anchor="middle" fill="var(--ink)">${d.v ? (Math.round(d.v*10)/10) : ''}</text>`; }).join('')}<line x1="26" x2="${W}" y1="${H+4}" y2="${H+4}" stroke="var(--line)"/></svg>`;
}
function svgDonut(v, label, color){ const r = 46, c = 2 * Math.PI * r, p = clamp(v || 0, 0, 1); return `<svg viewBox="0 0 120 120" width="120" role="img" aria-label="${esc(label)} ${Math.round(p*100)}%"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#e4e7ec" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${color||'#0b8f8f'}" stroke-width="12" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 60 60)" stroke-linecap="round"/><text x="60" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2433">${Math.round(p*100)}%</text></svg>`; }

/* ---------- KPIs ---------- */

    ${ks.map(k => { const v = kVal(k, n), s = kScore(k, n), all = SPS().filter(x => x.n <= curSprint()).map(x => kScore(k, x.n)).filter(x => x != null), pv = kScore(k, n - 1);

  <h3 style="margin-top:18px">Member scores — Sprint ${n}</h3><div class="card" style="padding:0;overflow:auto"><table><tr><th>Member</th><th>Attendance</th><th>Capacity used</th><th>Mentorship sessions</th><th>Speaking done</th><th>Applications</th><th>Certifications done</th><th>Score</th></tr>
  ${rows.map(r => `<tr><td>${esc(r.p.name)}</td><td>${pctS(r.at)}</td><td>${r.cp ? pctS(r.cp.pct) : '—'}</td><td>${r.mt ?? '—'}</td><td>${r.sm.done}</td><td>${S.japp.length ? r.ap : '—'}</td><td>${r.ce.length ? r.cd + ' / ' + r.ce.length : '—'}</td><td><b>${r.s ?? '—'}</b></td></tr>`).join('')}</table></div>

/* ---------- Ceremonies & attendance ---------- */
XV.ceremonies = () => {

  const next = E.filter(e => e.time && e.status !== 'Cancelled' && instant(e.date, e.time, S.cad.tz) >= Date.now()).sort((a,b) => instant(a.date, a.time, S.cad.tz) - instant(b.date, b.time, S.cad.tz))[0];
  return head + `<div class="grid g4">${tile(E.length, 'Ceremonies this sprint')}${tile(`${sched}/${E.length}`, 'With a time set')}${tile(`${inv}/${E.length}`, 'Invitations sent')}${tile(next ? `${fd(next.date)}, ${next.time}` : '—', next ? esc(next.name) : 'Next ceremony')}</div>
  <div class="card" style="margin-top:16px"><div class="row"><span class="sp small">Set a time and every invited member gets a Teams invitation by email with a calendar invite. ${S.cad.flow ? '<span class="pill green">Automatic sending on (Power Automate)</span>' : '<span class="pill">Automatic sending off — invitations download as ready-to-send Outlook emails (.eml) or calendar files (.ics)</span>'}</span>
  ${ro() ? '' : `<label class="small">Time for all <input type="time" id="cerAll"></label><button class="btn" onclick="cerAllTime('${o}',${n})">Apply to all</button><button class="btn p" onclick="cerSendAll('${o}',${n})">📨 Send all invitations</button><button class="btn" onclick="go('settings',{setTab:'cadence'})">⚙ Email settings</button>`}</div></div>
  <div class="grid g2" style="margin-top:16px">${E.map(e => cerCard(e)).join('')}</div>`;
};
function cerCard(e){
  const P = e.att.map(personMail), mailed = e.r.mailed || [], changed = !!(e.r.mkey && e.r.mkey !== [e.date, e.time, e.dur].join('|') && mailed.length), noE = P.filter(p => !okEm(p.e));
  const st = e.status === 'Cancelled' ? pill('Rejected','Cancelled') : !e.time ? pill('Pending','Set a time to send') : changed ? pill('Pending','Changed — send update') : mailed.length ? pill('Approved', `Invited ${mailed.length}`) : pill('','Not sent');
  const f = (k) => `onchange="cerSet('${e.id}','${k}',this)"`, dis = ro() ? 'disabled' : '';
  return `<div class="card" data-id="${esc(e.id)}"><div class="row"><h3 class="sp" style="margin:0">${e.icon} ${esc(e.name)}</h3>${st}</div>
  <div class="grid g3" style="margin-top:10px"><div class="fld"><label>Date</label><input type="date" value="${e.date}" ${f('date')} ${dis}></div><div class="fld"><label>Time (${esc(S.cad.tz.split('/').pop())})</label><input type="time" value="${e.time}" ${f('time')} ${dis}></div><div class="fld"><label>Minutes</label><input type="number" value="${e.dur}" ${f('dur')} ${dis}></div></div>
  <div class="grid g2"><div class="fld"><label>Facilitator</label><select ${f('fac')} ${dis}><option value=""></option>${S.people.filter(p => p.org === e.o).map(p => `<option value="${p.id}" ${p.id===e.fac?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="fld"><label>Status</label><select ${f('status')} ${dis}>${['Planned','Held','Cancelled'].map(x => `<option ${x===e.status?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <div class="fld"><label>Agenda</label><input value="${esc(e.agenda)}" ${f('agenda')} ${dis}></div><div class="fld"><label>Extra guests (emails)</label><input value="${esc(e.extra)}" ${f('extra')} ${dis} placeholder="guest@example.com"></div>
  <div class="small muted">${P.length} invited${noE.length ? ` · <span style="color:var(--amber)">no email: ${esc(noE.map(p => p.n).join(', '))}</span>` : ''}${e.r.msent ? ` · last sent ${fmtT(e.r.msent)}` : ''}</div>
  ${ro() ? '' : `<div class="row" style="margin-top:8px"><button class="btn s p" onclick="cerSend('${e.id}','new')">${changed ? 'Send update' : mailed.length ? 'Invite new people' : 'Send invitation'}</button><button class="btn s" onclick="cerSend('${e.id}','ics')">⬇ .ics</button><button class="btn s" onclick="cerSend('${e.id}','all')">Resend to all</button>${mailed.length ? `<button class="btn s d" onclick="cerSend('${e.id}','cancel')">Cancel & notify</button>` : ''}</div>`}</div>`;
}
function cerParse(id){ const [o, s, ...k] = id.split('|'); return {o, n:+s.slice(1), def:S.cerDefs.find(d => d.key === k.join('|'))}; }
function cerSet(id, k, el){ const r = S.cer[id] = S.cer[id] || {}; r[k] = k === 'dur' ? +el.value : el.value; log('Updated ceremony', `${id} ${k}`); save(); render(); }
function cerAllTime(o, n){ const t0 = $('#cerAll').value; if (!t0) return toast('Pick a time first'); S.cerDefs.forEach(d => { const id = cerId(o, n, d.key); (S.cer[id] = S.cer[id] || {}).time = t0; }); save(); render(); toast('Time applied to all ceremonies'); }
function cerSend(id, mode){
  const {o, n, def} = cerParse(id), e = cerE(o, n, def); if (!e.time && mode !== 'cancel') return toast(`Set a time for ${e.name} first.`);
  const P = [...new Set([e.fac, ...e.att].filter(Boolean))].map(personMail).concat(String(e.extra).split(/[\s,;]+/).filter(okEm).map(x => ({id:x, n:x, e:x})));
  const mailed = e.r.mailed || [], key = [e.date, e.time, e.dur].join('|'), changed = e.r.mkey && e.r.mkey !== key;
  const targets = mode === 'cancel' ? P.filter(p => mailed.includes(p.e)) : (mode === 'all' || mode === 'ics' || changed) ? P : P.filter(p => !mailed.includes(p.e));
  const start = instant(e.date, e.time || '09:00', S.cad.tz);
  const ev = {uid:'cer-' + id.replace(/[^\w]/g,'-'), seq:(e.r.seq || 0) + (changed || mode === 'cancel' ? 1 : 0), title:`${org(o)?.name} · Sprint ${n} · ${e.name}`, start, end:start + e.dur * 60000, desc:`${e.name} for Sprint ${n}${e.fac ? '\nFacilitator: ' + pname(e.fac) : ''}${e.agenda ? '\nAgenda: ' + e.agenda : ''}`, cancel:mode === 'cancel'};
  const sent = sendInvite(ev, targets, mode === 'ics' ? 'ics' : 'eml'); if (!sent) return;
  const r = S.cer[id] = S.cer[id] || {}; r.seq = ev.seq; if (mode === 'cancel'){ r.status = 'Cancelled'; r.mailed = []; } else { r.mailed = [...new Set([...(changed ? [] : mailed), ...sent])]; r.mkey = key; r.msent = new Date().toISOString(); }
  log(mode === 'cancel' ? 'Cancelled ceremony' : 'Sent ceremony invitation', `${ev.title} → ${sent.length}`); save(); render();
}
function cerSendAll(o, n){ S.cerDefs.forEach(d => { const e = cerE(o, n, d); if (e.time && e.status !== 'Cancelled') cerSend(e.id, 'new'); }); }
function attendanceView(n){

  <div class="card" style="padding:0;overflow:auto"><table><tr><th>Member</th><th>Role</th>${cols.map(m => `<th>${esc(m.label)}<br><span class="small muted" style="text-transform:none">${wd(m.date)} ${fd(m.date)}${m.time?' · '+esc(m.time):''}</span></th>`).join('')}<th>Present</th><th>Marked</th><th>%</th><th>Status</th></tr>
  ${ppl.map(p => { const s = attM(n, p); return `<tr><td>${esc(p.name)}</td><td class="small muted">${esc(p.title)}</td>${cols.map(m => applies(m, p) ? `<td><select aria-label="${esc(p.name)} ${esc(m.label)}" ${ro()?'disabled':''} onchange="setAtt(${n},'${p.id}','${esc(m.key).replace(/'/g,"\\'")}',this.value)" style="padding:3px 6px">${['','P','L','E','A'].map(v => `<option ${doc[p.id+'|'+m.key]===v?'selected':''}>${v}</option>`).join('')}</select></td>` : '<td class="small muted">N/A</td>').join('')}<td>${s.p}</td><td>${s.s}</td><td>${pctS(s.pct)}</td><td>${s.pct == null ? '' : s.pct < .6 ? pill('Rejected','Critical') : s.pct < .9 ? pill('Pending','Watch') : pill('Approved','Good')}</td></tr>`; }).join('')}</table></div>`;
}
function setAtt(n, pid, key, v){ const d = S.att['S' + n] = S.att['S' + n] || {}; if (v) d[pid + '|' + key] = v; else delete d[pid + '|' + key]; log('Marked attendance', `S${n} ${pname(pid)} ${key}=${v}`); save(); render(); }

/* ---------- Mentorship ---------- */
XV.mentor = () => {
  const n = SPn().n, ppl = teamPeople(), tab = UI.mTab || 'members', up = S.msess.filter(r => (r.status || 'Planned') === 'Planned' && r.date >= TODAY).length;
  const mentors = [...new Set([...S.mentees.map(x => x.mentorName).filter(Boolean), ...Object.values(S.ment).flatMap(d => Object.values(d).flatMap(x => (x.mentors||[]).map(m => m.n))).filter(Boolean), ...S.msess.map(x => x.mentor).filter(Boolean)])];

function setMentDate(n, pid, i, v){ const s = S.ment['S' + n] = S.ment['S' + n] || {}; const d = s[pid] = Object.assign(mentDoc(n, pid), s[pid] || {}); d.dates = d.dates || []; d.dates[i] = v; const c = d.dates.filter(Boolean).length; if (c > (+d.sessions || 0)) d.sessions = c; save(); render(); }

/* ---------- Cresticons importer ---------- */
function jsonAt(src, start){ let d = 0, ins = false, es = false; for (let k = start; k < src.length; k++){ const ch = src[k]; if (ins){ if (es) es = false; else if (ch === '\\') es = true; else if (ch === '"') ins = false; continue; } if (ch === '"') ins = true; else if (ch === '{' || ch === '[') d++; else if (ch === '}' || ch === ']'){ d--; if (!d) return src.slice(start, k + 1); } } throw new Error('Unterminated data'); }
const jsLit = s => JSON.parse(s.replace(/([{,])\s*([A-Za-z_]\w*)\s*:/g, '$1"$2":').replace(/([\[,:])\s*\.(\d)/g, '$10.$2'));
function parseCresticons(text){

  if (/^\s*[{[]/.test(text)){ const j = JSON.parse(text); out.seed = j.data && typeof j.data === 'object' ? j.data : j; return out; }
  const si = text.indexOf('var SEED='); if (si < 0) throw new Error('This file does not look like a Cresticons Team Hub'); out.seed = JSON.parse(jsonAt(text, text.indexOf('{', si)));
  const ci = text.indexOf('const CFG={'); if (ci >= 0){ const head = text.slice(ci, ci + 1500); const g = (k, num) => { const m = head.match(new RegExp('[{,]' + k + ':' + (num ? '(\\d+)' : '"([^"]*)"'))); return m ? (num ? +m[1] : m[1]) : undefined; };

    const mi = text.indexOf('members:', ci); if (mi >= 0) out.members = JSON.parse(jsonAt(text, text.indexOf('[', mi))); }
  const gi = text.indexOf('const GU='); if (gi >= 0) out.gu = JSON.parse(jsonAt(text, text.indexOf('[', gi)));
  const ei = text.indexOf('EMD={'); if (ei >= 0) out.emd = JSON.parse(jsonAt(text, ei + 4));
  const xi = text.indexOf('const CERX={'); if (xi >= 0) try { out.cerx = jsLit(jsonAt(text, xi + 11)); } catch(e) {}
  const ki = text.indexOf('const KP=['); if (ki >= 0) try { out.kp = jsLit(jsonAt(text, ki + 9)); } catch(e) {}
  const pi = text.indexOf('const PH={'); if (pi >= 0) try { out.ph = JSON.parse(jsonAt(text, pi + 9)); } catch(e) {}
  return out;
}
